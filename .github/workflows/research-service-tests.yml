name: Research Service Tests

on:
  pull_request:
    paths:
      - 'managed_agents/research_service/**'
      - '.github/workflows/research-service-tests.yml'
  push:
    branches: [main]
    paths:
      - 'managed_agents/research_service/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: managed_agents/research_service

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0 (sha-pinned)
        with:
          enable-cache: true
          cache-dependency-glob: "managed_agents/research_service/uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
