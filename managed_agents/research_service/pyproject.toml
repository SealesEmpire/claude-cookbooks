[project]
name = "research-service"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.139.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
