    expected: ["$30"]
    source_domain: nps.gov
  - entity: Yellowstone
    expected: ["$35"]
    source_domain: nps.gov
  - entity: Everglades
    expected: ["$35"]
    source_domain: nps.gov
  - entity: Grand Canyon
    expected: ["$35"]
    source_domain: nps.gov
  - entity: Glacier
    expected: ["$35"]
    source_domain: nps.gov
  - entity: Olympic
    expected: ["$30"]
    source_domain: nps.gov
  - entity: Big Bend
    expected: ["$30"]
    source_domain: nps.gov
  - entity: Joshua Tree
    expected: ["$30"]
    source_domain: nps.gov
  - entity: Yosemite
    expected: ["$35"]
    source_domain: nps.gov
