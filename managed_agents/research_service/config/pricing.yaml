# Versioned pricing table, $ / MTok.
#
# /v1/models reports capabilities but not pricing, so these numbers live
# in config, not code. Bump `version` and update rates when the pricing
# page changes. Cache multipliers apply to the input rate.
version: 2026-07-01
source: https://platform.claude.com/docs/en/about-claude/pricing
cache_multipliers:
  ephemeral_5m_write: 1.25
  ephemeral_1h_write: 2.0
  read: 0.1
models:
  claude-fable-5:
    input: 10.0
    output: 50.0
  claude-sonnet-5:
    # Introductory rate ($2/$10 through Aug 31, 2026; standard $3/$15 after).
    input: 2.0
    output: 10.0
  claude-haiku-4-5:
    input: 1.0
    output: 5.0
